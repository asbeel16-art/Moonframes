    <!-- Tailwind CSS -->

    <!-- Google Fonts: Cormorant Garamond & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
            color: #e5e5e5;
        }
        .serif-font {
            font-family: 'Cormorant Garamond', serif;
        }
        .tracking-ultra {
            letter-spacing: 0.35em;
        }
        
        /* Camera Viewfinder Corners */
        .corner-tl { top: -1px; left: -1px; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; }
        .corner-tr { top: -1px; right: -1px; border-top: 2px solid #ffffff; border-right: 2px solid #ffffff; }
        .corner-bl { bottom: -1px; left: -1px; border-bottom: 2px solid #ffffff; border-left: 2px solid #ffffff; }
        .corner-br { bottom: -1px; right: -1px; border-bottom: 2px solid #ffffff; border-right: 2px solid #ffffff; }

        /* Button Hover Inversion & Smooth Elevation */
        .btn-editorial {
            background-color: transparent;
            border: 1px solid #262626;
            color: #e5e5e5;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-editorial:hover, .btn-editorial:active {
            background-color: #f5f5f5;
            color: #050505;
            border-color: #f5f5f5;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(255, 255, 255, 0.15);
        }

        /* Subtle Viewfinder Shutter Line Animation */
        @keyframes pulse-subtle {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        .animate-shutter {
            animation: pulse-subtle 4s ease-in-out infinite;
        }
    </style>
</head>

        <div class="mt-8 pt-6 border-t border-gray-900 flex justify-between items-center">
            <button id="copyBtn" onclick="copyLink()" class="text-[10px] tracking-widest uppercase text-gray-500 hover:text-white transition-colors flex items-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684m0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>

            </p>

    </main>

    <script>
        function copyLink() {
            var dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = window.location.href;
            dummy.select();
            
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Error al copiar', err);
            }
            document.body.removeChild(dummy);
        }

        function showToast() {
            var toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(function() {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
            }, 2500);
        }
    </script>
